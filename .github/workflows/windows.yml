name: Windows desktop

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      QT_VERSION: "6.8.1"
      QT_ARCH: win64_msvc2022_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:/Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-v2

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: "qtquick3d qtwebsockets qtshadertools"
          dir: C:/Qt
          cache: false

      - name: Resolve Qt prefix
        shell: pwsh
        run: |
          $versionRoot = "C:/Qt/Qt/${{ env.QT_VERSION }}"
          if (-not (Test-Path $versionRoot)) { throw "Qt version root missing: $versionRoot" }
          $candidates = @(
            (Join-Path $versionRoot "msvc2022_64"),
            (Join-Path $versionRoot "${{ env.QT_ARCH }}"),
            (Join-Path "C:/Qt" "msvc2022_64")
          )
          $kit = $candidates | Where-Object { Test-Path (Join-Path $_ "bin/qmake.exe") } | Select-Object -First 1
          if (-not $kit) {
            $kit = Get-ChildItem $versionRoot -Directory | Where-Object { Test-Path (Join-Path $_.FullName "bin/qmake.exe") } | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $kit) { throw "Qt kit with qmake.exe not found under $versionRoot" }
          "QT_PREFIX=$kit" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "QT_PREFIX=$kit"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Expose Qt runtime for tests
        shell: pwsh
        run: |
          if (-not $env:QT_PREFIX) { throw "QT_PREFIX is empty" }
          $bin = Join-Path $env:QT_PREFIX "bin"
          if (-not (Test-Path (Join-Path $bin "Qt6Core.dll"))) { throw "Qt6Core.dll missing under $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          "QT_PLUGIN_PATH=$(Join-Path $env:QT_PREFIX 'plugins')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QT_QPA_PLATFORM=offscreen" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Added to PATH: $bin"

      - name: Harden build workspace
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-windows | Out-Null
          # Exclusion must exist before compiling test EXEs; otherwise Defender can quarantine update_tests.exe.
          Add-MpPreference -ExclusionPath "$PWD" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$PWD\build-windows" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions requested for $PWD"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_PREFIX"

      - name: Build
        run: cmake --build build-windows --config Release --target ops_core_tests tg_update_core_tests ticketgo-izleme ticketgo-update-helper

      - name: Stage Qt DLLs beside test binaries
        shell: pwsh
        run: |
          $bin = Join-Path $env:QT_PREFIX "bin"
          $dest = Join-Path $PWD "build-windows"
          foreach ($name in @("Qt6Core.dll","Qt6Network.dll","Qt6Test.dll","Qt6Gui.dll")) {
            $src = Join-Path $bin $name
            if (Test-Path $src) { Copy-Item $src $dest -Force; Write-Host "staged $name" }
          }
          Get-ChildItem $dest -Filter *.exe | ForEach-Object { "{0} {1} bytes" -f $_.Name, $_.Length }

      - name: Test ops_core
        shell: pwsh
        run: |
          Set-Location build-windows
          if (-not (Test-Path .\ops_core_tests.exe)) { throw "ops_core_tests.exe missing" }
          $p = Start-Process -FilePath .\ops_core_tests.exe -ArgumentList @("-v2","-o","ops_core_tests.log,txt") -Wait -PassThru -NoNewWindow -RedirectStandardOutput ops_core_tests.console.txt -RedirectStandardError ops_core_tests.err.txt
          $code = $p.ExitCode
          Write-Host "===== ops_core console ====="; Get-Content .\ops_core_tests.console.txt -ErrorAction SilentlyContinue
          Write-Host "===== ops_core err ====="; Get-Content .\ops_core_tests.err.txt -ErrorAction SilentlyContinue
          Write-Host "===== ops_core log ====="; Get-Content .\ops_core_tests.log -ErrorAction SilentlyContinue
          Write-Host "ops_core_tests exit_code=$code"
          if ($code -ne 0) { throw "ops_core_tests failed with exit_code=$code" }

      - name: Test update_core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $logs = Join-Path $env:GITHUB_WORKSPACE "ci-logs"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $dir = Join-Path $env:GITHUB_WORKSPACE "build-windows"
          $diag = Join-Path $logs "tg_update_core_tests.diag.txt"
          $exe = Join-Path $dir "tg_update_core_tests.exe"
          Set-Content -Path $diag -Value "begin=$(Get-Date -Format o)"
          Add-Content $diag "workspace=$env:GITHUB_WORKSPACE"
          Add-Content $diag "pwd=$PWD"
          Add-Content $diag "exe_exists=$(Test-Path $exe)"
          Get-ChildItem $dir -Filter *.exe | ForEach-Object { Add-Content $diag ("exe=" + $_.Name + " size=" + $_.Length) }
          if (-not (Test-Path $exe)) { Get-Content $diag; throw "tg_update_core_tests.exe missing" }
          $item = Get-Item $exe
          Add-Content $diag "exe_full=$($item.FullName) exe_size=$($item.Length)"
          $out = Join-Path $logs "tg_update_core_tests.console.txt"
          $err = Join-Path $logs "tg_update_core_tests.err.txt"
          $log = Join-Path $logs "tg_update_core_tests.log"
          Remove-Item $out,$err,$log -ErrorAction SilentlyContinue
          Push-Location $dir
          cmd.exe /c "tg_update_core_tests.exe -v2 `"-o`" `"$log,txt`" > `"$out`" 2> `"$err`""
          $code = $LASTEXITCODE
          Pop-Location
          Add-Content $diag "cmd_exit=$code"
          foreach ($path in @($diag,$out,$err,$log)) {
            if (-not (Test-Path $path)) { Set-Content $path "missing after launch" }
            Write-Host "===== $(Split-Path $path -Leaf) ====="
            Get-Content $path -ErrorAction SilentlyContinue
          }
          Write-Host "tg_update_core_tests exit_code=$code"
          $summary = @()
          foreach ($path in @($log,$out,$err,$diag)) { $summary += Get-Content $path -ErrorAction SilentlyContinue }
          $failLines = $summary | Where-Object { $_ -match 'FAIL!|Totals:|QFATAL|ASSERT|exit_code|Cannot|error|not found|dll|cmd_exit|begin=' }
          if ($failLines) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("## tg_update_core_tests failure`n```n" + ($failLines -join "`n") + "`n```")
          }
          if ($code -ne 0) {
            $detail = ($failLines -join "`n")
            if (-not $detail) { $detail = ($summary | Select-Object -Last 80) -join "`n" }
            throw "tg_update_core_tests failed with exit_code=$code`n$detail"
          }

      - name: Upload update_tests logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-tests-logs
          path: |
            ci-logs/
            build-windows/ops_core_tests.log
            build-windows/ops_core_tests.console.txt
            build-windows/ops_core_tests.err.txt
          if-no-files-found: warn

      - name: Smoke probe
        shell: pwsh
        run: |
          $exe = ".\build-windows\TicketGoIzleme.exe"
          if (-not (Test-Path $exe)) { throw "TicketGoIzleme.exe missing" }
          & $exe --probe-once
          $code = $LASTEXITCODE
          Write-Host "smoke probe exit_code=$code"
          if ($code -ne 0) { throw "smoke probe failed with exit_code=$code" }
        # GUI screens and live login are not available on hosted runners.

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $dist = "build-windows/dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build-windows/TicketGoIzleme.exe $dist
          if (Test-Path build-windows/ticketgo-update-helper.exe) {
            Copy-Item build-windows/ticketgo-update-helper.exe $dist
          }
          & "$env:QT_PREFIX/bin/windeployqt.exe" "$dist/TicketGoIzleme.exe" --qmldir qml --release --no-translations
          if (Test-Path build-windows/ticketgo-update-helper.exe) {
            Copy-Item build-windows/ticketgo-update-helper.exe "$dist/ticketgo-update-helper.exe" -Force
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "/DBuildDir=$PWD\build-windows\dist" "/DOutputDir=$PWD\build-windows" packaging\windows\TicketGoIzleme.iss

      - name: SHA256 and Windows manifest fragment
        shell: pwsh
        run: |
          $setup = "build-windows/TicketGoIzleme-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "installer missing" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          $size = (Get-Item $setup).Length
          # Asset name must match UpdateManager lookup: TicketGoIzleme-update-manifest.json
          @"
          {
            "channel": "stable",
            "version": "0.1.3",
            "assets": [
              {
                "name": "TicketGoIzleme-Windows-x64-Setup.exe",
                "platform": "windows",
                "arch": "x64",
                "sha256": "$hash",
                "size": $size,
                "bundleId": "tr.ticketgoteknoloji.izleme"
              }
            ]
          }
          "@ | Set-Content -Path build-windows/TicketGoIzleme-update-manifest.json -Encoding utf8NoBOM
          "TicketGoIzleme-Windows-x64-Setup.exe  $hash" | Set-Content -Path build-windows/TicketGoIzleme-Windows-x64-Setup.exe.sha256 -Encoding ascii
          "SETUP_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "SHA256=$hash"
          Write-Host "NOTE: Installer is UNSIGNED (no Windows code-signing certificate in GitHub Secrets)."
          Write-Host "Update API target: https://api.github.com/repos/ticketgoteknoloji-web/ticketgo-izleme-windows/releases/latest"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TicketGoIzleme-Windows-x64
          path: |
            build-windows/TicketGoIzleme-Windows-x64-Setup.exe
            build-windows/TicketGoIzleme-Windows-x64-Setup.exe.sha256
            build-windows/TicketGoIzleme-update-manifest.json
          if-no-files-found: error

      # Release publishing is intentionally omitted until Windows installer + update flow are verified.
      # Never attach these assets to the macOS repository Releases.
